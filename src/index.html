<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Timestamp</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js"></script>
</head>
<body>
    <h1>Data atual</h1>
    <p>Unix:<span id='unixAtual'></span></p>
    <p>UTC:<span id='utcAtual'></span></p>
    <h2>Conversor</h2>
    <input id='valorDig' type="text" placeholder="Digite uma data (UTC ou Unix)"></input>
    <input type="text" id="fuso" placeholder="Digite um fuso-horário(opcional)"></input>
    <button id="converte">Converter</button>
    <p>Unix:<span id='unixResult'></span></p>
    <p>UTC:<span id='utcResult'></span></p>
</body>
</html>
