<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Timestamp</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js"></script>
</head>
<body>
    <h1>Data atual</h1>
    <p>Unix:<span id='unixAtual'></span></p>
    <p>UTC:<span id='utcAtual'></span></p>

    <h2>Conversor</h2>
    <input id='valorDig' type="text" placeholder="Digite uma data (UTC ou Unix)"></input>
    <label for="fuso">Fuso-horário</label>
    <input type="text" id="fuso" placeholder="Número de -12 a +12(opcional)"></input>
    <button id="converte">Converter</button>
    <p>Unix:<span id='unixResult'></span></p>
    <p>UTC:<span id='utcResult'></span></p>

    <h2>Diferença entre datas</h2>
    <div id="diferença">
        <input type="text" id="data1"></input>
        <input type="text" id="data2"></input>
    </div>
    <button id="diferenca">Calcular diferença</button>
    <p><span id="difResult"></span></p>
</body>
</html>
